name: Zbuduj i wydaj

# Buduje Klyo Switchera na prawdziwym macOS (maszyna GitHuba), więc nikt nie musi
# niczego instalować na własnym Macu. Gdy w ustawieniach repozytorium są sekrety
# z certyfikatem, program jest dodatkowo podpisywany i wysyłany do Apple po
# potwierdzenie — wtedy otwiera się u każdego zwykłym dwuklikiem.
# Bez sekretów przebieg i tak ma sens: sprawdza, czy kod się kompiluje.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  wydaj:
    runs-on: macos-15
    env:
      MAMY_PODPIS: ${{ secrets.CERTYFIKAT_P12 != '' }}
      MAMY_NOTARYZACJE: ${{ secrets.HASLO_APLIKACJI != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Wersja z Info.plist
        id: wersja
        run: |
          set -euo pipefail
          w=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" src/Sources/Info.plist)
          b=$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" src/Sources/Info.plist)
          echo "wersja=$w" >> "$GITHUB_OUTPUT"
          echo "Wydanie $w (build $b); podpis: ${MAMY_PODPIS}; notaryzacja: ${MAMY_NOTARYZACJE}"

      - name: Zbuduj program dla obu rodzajów Maców
        run: |
          set -euo pipefail
          mkdir -p "build/Klyo Switcher.app/Contents/MacOS" "build/Klyo Switcher.app/Contents/Resources"
          xcrun swiftc -O -whole-module-optimization -swift-version 5 \
            -target arm64-apple-macos13.0 -o build/klyo-arm64 src/Sources/*.swift
          xcrun swiftc -O -whole-module-optimization -swift-version 5 \
            -target x86_64-apple-macos13.0 -o build/klyo-x86_64 src/Sources/*.swift
          lipo -create -output "build/Klyo Switcher.app/Contents/MacOS/KlyoSwitcher" \
            build/klyo-arm64 build/klyo-x86_64
          lipo -info "build/Klyo Switcher.app/Contents/MacOS/KlyoSwitcher"
          cp src/Sources/Info.plist "build/Klyo Switcher.app/Contents/Info.plist"
          printf 'APPL????' > "build/Klyo Switcher.app/Contents/PkgInfo"

      - name: Narysuj ikonę
        continue-on-error: true
        run: |
          set -euo pipefail
          xcrun swiftc -O -swift-version 5 -o build/icongen src/IconGen/main.swift
          mkdir -p build/AppIcon.iconset
          ./build/icongen build/AppIcon.iconset
          iconutil -c icns build/AppIcon.iconset -o "build/Klyo Switcher.app/Contents/Resources/AppIcon.icns"

      - name: Wpuść certyfikat do pęku kluczy tej maszyny
        if: env.MAMY_PODPIS == 'true'
        env:
          CERTYFIKAT_P12: ${{ secrets.CERTYFIKAT_P12 }}
          HASLO_P12: ${{ secrets.HASLO_P12 }}
        run: |
          set -euo pipefail
          pek="$RUNNER_TEMP/klyo.keychain-db"
          haslo_peku="$(openssl rand -base64 24)"
          security create-keychain -p "$haslo_peku" "$pek"
          security set-keychain-settings -lut 3600 "$pek"
          security unlock-keychain -p "$haslo_peku" "$pek"
          echo "$CERTYFIKAT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$pek" -P "$HASLO_P12" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$haslo_peku" "$pek" >/dev/null
          security list-keychain -d user -s "$pek" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$pek"

      - name: Podpisz
        if: env.MAMY_PODPIS == 'true'
        run: |
          set -euo pipefail
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0"><dict>' \
            '<key>com.apple.security.automation.apple-events</key><true/>' \
            '</dict></plist>' > "$RUNNER_TEMP/uprawnienia.plist"
          podpisujacy="$(security find-identity -v -p codesigning | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          echo "Podpisuję jako: $podpisujacy"
          codesign --force --deep --options runtime --timestamp \
            --entitlements "$RUNNER_TEMP/uprawnienia.plist" \
            --sign "$podpisujacy" "build/Klyo Switcher.app"
          codesign --verify --strict --verbose=2 "build/Klyo Switcher.app"

      - name: Wyślij do Apple po potwierdzenie
        if: env.MAMY_PODPIS == 'true' && env.MAMY_NOTARYZACJE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          HASLO_APLIKACJI: ${{ secrets.HASLO_APLIKACJI }}
          ZESPOL: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent "build/Klyo Switcher.app" "$RUNNER_TEMP/do-apple.zip"
          xcrun notarytool submit "$RUNNER_TEMP/do-apple.zip" \
            --apple-id "$APPLE_ID" --password "$HASLO_APLIKACJI" --team-id "$ZESPOL" --wait
          xcrun stapler staple "build/Klyo Switcher.app"
          spctl --assess --type execute --verbose "build/Klyo Switcher.app" || true

      - name: Spakuj
        run: |
          set -euo pipefail
          if [ "${MAMY_PODPIS}" = "true" ]; then
            nazwa="Klyo-Switcher-${{ steps.wersja.outputs.wersja }}-uniwersalny.zip"
          else
            nazwa="Klyo-Switcher-${{ steps.wersja.outputs.wersja }}-BEZ-PODPISU.zip"
          fi
          ditto -c -k --sequesterRsrc --keepParent "build/Klyo Switcher.app" "$nazwa"
          shasum -a 256 "$nazwa"
          echo "PLIK=$nazwa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: klyo-switcher
          path: ${{ env.PLIK }}
          retention-days: 30
